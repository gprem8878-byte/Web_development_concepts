<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register: </p>
    <hr>
    <h2>Personal details</h2>
    <form>
        <label for = "Full name">First name: </label>
        <input type = "text" name = "userfullname"id = "Full name"placeholder = "Arjun"required>
        <br>
        <br>
        <label for = "Last name">Last Name: </label>
        <input type = "text"name = "userlastname"id = "Last name"placeholder = "Kumar">
        <br>
        <br>
        <label for = "DOB">Date of Birth: </label>
        <input type ="date" name = "dob" id = "DOB">
        <br>
        <br>
        <label>Gender:</label>
        <br>
        <label for = "male">Male</label>
        <input type = "radio" name = "usergender" id = "male">
        <br>
        <label for = "female">FeMale</label>
        <input type = "radio" name = "usergender" id = "female">
        <br>
        <label for = "other">Other</label>
        <input type = "radio" name = "usergender" id = "other">
        <br>
        <br>
        <label>Upload Your Photo: </label>
        <br>
        <input type = "File" name = "file">
        <br>
        <hr>
        <br>
        <h2>Contact Information</h2>
        <label for = "Email">Email Address: </label>
        <input type = "email" name = "useremail" id = "Email">
        <br>
        <br>
        <label for="Phone">Phone Number: </label>
        <input type = "tel" name = "userphone" id = "Phone">
        <br>
        <br>
        <label for="Address">Mailing Address: </label>
        <br>
        <textarea name = "Address"id="Address" row ="30"column ="30"></textarea>
        <br>
        <hr>
        <h2>Academic Information</h2>
        <br>
        <label for="Course">Select Your Course: </label>
        <select name ="course"id = "Course">
            <option value="" disabled selected>Courses</option>
            <option value ="CSE">CSE</option>
            <option value ="BCA">BCA</option>
            <option value ="BBA">BBA</option>
        </select>
        <br></br>
        <label>Extra Curricular ACtivity</label>
        <br></br>
        <label for="Sports">Sports</label>
        <input type="checkbox"name ="interest"id="Sports" value="Sports">
        <br>
        <label for="Music">Music</label>
        <input type="checkbox"name ="interest"id="Music"value="Music">
        <br>
        <label for="Technology">Technology</label>
        <input type="checkbox"name ="interest"id="Technology"value="Technology">
        <br>
        <label for="Voluntary">Voluntary</label>
        <input type="checkbox"name ="interest"id="Voluntary"value="Voluntary">
        <br>
        <hr>
        <h2>Create Your Account: </h2>
        <label for="pass">Create Password</label>
        <input type="password" name ="password"id ="pass"value="password">
        <br></br>
        <label for = "pet">Security Questions: </label>
        <select name="Pet" id="pet">
            <option value="" disabled selected>-- what was your first pet's name</option>
            <option value ="chomu">Chomu</option>
            <option value ="bittu">Bittu</option>
            <option value ="ramlu">Ramlu</option>
        </select>
        <br>
        <br>
        <label for="ans">Security Answer: </label>
        <input type ="text"name = "securityans"id = "ans">
        <br>
        <br></br>
        <input type ="checkbox">
        <label> I agree to the terms and conditions</label>
        <br>
        <hr>
        <button type ="submit">Register</button>
        <button type ="reset">Clear form</button>
    </form>
</body>
</html>
