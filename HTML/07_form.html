<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for ="name">Name </label>
        <input type = "text" name = "username" id = "name">
        <br><br>
        <label for = "age">Age </label>
        <input type = "number" name = "userage" id = "age">
        <br><br>
        <label for ="fathername">Father Name </label>
        <input type = "text" name = "userfathername" id = "fathername">
        <br><br>
        <label for ="password">Password </label>
        <input type = "password" name ="userpassword" id = "password">
        <br>
        <label>Gender: </label>
        <br>
        <label for = "male">Male</label>
        <input type="radio" name = "gender"id = "male" value = "male">
        <label for ="female">Female</label>
        <input type="radio" name = "gender" id = "female" value = "female">
        <label for = "other">Other</label>
        <input type="radio" name = "gender"id = "other" value = "other">
        <label>Subjects: </label>
        <br>
        <label for = "C++">C++</label>
        <input type = "checkbox" name = "subject" id = "C++" value = "C++">
        <label for = "Java">Java</label>
        <input type = "checkbox" name = "subject" id = "Java" value = "Java">
        <label for = "Python">Python</label>
        <input type = "checkbox" name = "subject" id = "Python" value = "Python">
        <label for = "Javascript">Javascript</label>
        <input type = "checkbox" name = "subject" id = "Javascript" value = "Javascript">
        <br>
        <input type="submit">
    </form>
</body>
</html>
